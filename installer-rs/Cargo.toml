[package]
name = "antigravity-modloader-setup"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "antigravity-modloader-setup"
path = "src/main.rs"

[[bin]]
name = "antigravity-modloader-cli"
path = "src/cli.rs"

[dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wry = "0.57.3"
tao = "0.37.3"
http = "1.5.0"
webview2-com-sys = { version = "0.39.1", default-features = false }
